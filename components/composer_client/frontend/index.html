<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Composer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="composer">
      <textarea
        aria-label="Mensaje"
        id="message"
        placeholder="Contame qué lugar de El Salvador querés descubrir..."
        rows="1"
      ></textarea>
      <div class="composer-status" id="dictation-status" aria-live="polite" hidden></div>
      <button id="dictation" class="dictation" type="button" aria-label="Dictar mensaje" title="Dictar mensaje">🎤</button>
      <button id="action" type="button" aria-label="Iniciar conversación por voz" title="Iniciar conversación por voz">◉</button>
    </div>
    <script src="app.js"></script>
  </body>
</html>
