<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Composer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="composer">
      <textarea
        aria-label="Mensaje"
        id="message"
        placeholder="Contame qué lugar de El Salvador querés descubrir..."
        rows="1"
      ></textarea>
      <button id="action" type="button" aria-label="Hablar con Mochileros" title="Hablar con Mochileros">🎙️</button>
    </div>
    <script src="app.js"></script>
  </body>
</html>
